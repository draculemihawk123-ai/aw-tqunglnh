name: Go core spike gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Offline contract suite
        run: go test -count=1 ./...

  linux-race-and-stability:
    name: Linux race and stability
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: true
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Repeat offline suite ten times
        shell: bash
        run: |
          for run in $(seq 1 10); do
            echo "offline suite run ${run}/10"
            go test -count=1 ./...
          done
