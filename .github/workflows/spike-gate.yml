name: Go core spike gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Docs coverage gate (V1-00C pre-V1 aggregate gate)
        run: go run ./cmd/docs-coverage-check
      - name: Offline contract suite
        run: go test -count=1 ./...
      # V0-11A diagnostic: the only place these timing-sensitive failures
      # (docs/design/02-v0-spike-verdict.md V0-11A) were ever observed is the
      # real windows-latest runner — neither reproduced locally. Repeat
      # exactly the tests that failed, on this same runner, well beyond their
      # normal single pass, to build real confidence in the fixes
      # (_txlock=immediate in internal/adapters/sqlite/db.go; the deterministic
      # waitPastLeaseUntil/waitPastWriteLeaseUntil wait in
      # spk09_workspace_quarantine_test.go and spk09_scenario.go) rather than
      # trusting one lucky green run.
      - name: Stress write-lease race path (Windows, V0-11A diagnostic)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go test -run '^TestWriteLeaseRaceHasOneWinnerForSameRepository$' -count=20 -timeout 120s ./internal/adapters/sqlite/...
          go test -run '^TestSPK09QuarantineRecreateFencesStaleGeneration$' -count=30 -timeout 120s ./internal/adapters/sqlite/...
          go test -run '^TestDefaultScenariosFormAValidRegistryAndCleanRun$' -count=5 -timeout 300s ./internal/spikeacceptance/...

      # V0-12 (docs/design/02-v0-spike-verdict.md): internal/archtest enforces
      # domain/app never depends on adapter/OS/provider specifics — a
      # violation already fails "Offline contract suite" above on both OS
      # (it is a real `go test ./...` package). This step additionally
      # produces a standalone, human-readable report artifact so the result
      # is traceable without digging through the full suite's log. Checks are
      # OS-independent (pure import-graph/AST/reflection analysis), so this
      # only needs to run once.
      - name: Boundary/dependency report (V0-13)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p boundary-report
          if go test -v ./internal/archtest/... > boundary-report/v0-13-boundary-report.log 2>&1; then
            echo "V0-13 boundary/dependency checks: all passed"
          else
            echo "V0-13 boundary/dependency checks FAILED — see boundary-report/v0-13-boundary-report.log"
            cat boundary-report/v0-13-boundary-report.log
            exit 1
          fi
          cat boundary-report/v0-13-boundary-report.log

      - name: Upload V0-13 boundary/dependency report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0-13-boundary-report
          path: boundary-report/
          if-no-files-found: error
          retention-days: 7

  # V0-12 (docs/design/02-v0-spike-verdict.md): race detector clean + 10 full
  # offline-suite runs not flaky, with SPK-08's own 100-iteration write-lease
  # race (internal/spikeacceptance/spk08_scenario.go) exercised inside every
  # one of those 10 runs via TestDefaultScenariosFormAValidRegistryAndCleanRun.
  # A failure anywhere in this job is a real signal to root-cause, never a
  # reason to just retry until it goes green.
  linux-race-and-stability:
    name: Linux race and stability (V0-12)
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: Race detector and 10x offline-suite stability, aggregated report
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p stability-report

          echo "== race detector (go test -race -count=1 ./...) =="
          race_start=$(date +%s)
          if go test -race -count=1 ./... > stability-report/race-detector.log 2>&1; then
            race_passed=true
          else
            race_passed=false
          fi
          race_end=$(date +%s)
          cat stability-report/race-detector.log
          echo "race detector passed=${race_passed} duration=$((race_end - race_start))s"

          echo "== SPK-08 write-lease race iteration count (static check) =="
          spk08_iterations=$(grep -oP 'iterations\s*=\s*\K\d+' internal/spikeacceptance/spk08_scenario.go | head -n1)
          if [ -z "${spk08_iterations}" ] || [ "${spk08_iterations}" -lt 100 ]; then
            echo "SPK-08 iteration count check FAILED: found '${spk08_iterations}', want >= 100"
            spk08_ok=false
          else
            echo "SPK-08 iteration count = ${spk08_iterations} (>= 100, required in every one of the 10 runs below via TestDefaultScenariosFormAValidRegistryAndCleanRun)"
            spk08_ok=true
          fi

          echo "== 10x full offline suite, no retry-until-green =="
          runs_json="[]"
          all_stable=true
          for i in $(seq 1 10); do
            echo "-- offline suite run ${i}/10 --"
            run_start=$(date +%s)
            if go test -count=1 ./... > "stability-report/suite-run-${i}.log" 2>&1; then
              run_passed=true
            else
              run_passed=false
              all_stable=false
              echo "run ${i} FAILED, see stability-report/suite-run-${i}.log"
              tail -n 60 "stability-report/suite-run-${i}.log"
            fi
            run_end=$(date +%s)
            duration=$((run_end - run_start))
            echo "run ${i}/10 passed=${run_passed} duration=${duration}s"

            # TestDefaultScenariosFormAValidRegistryAndCleanRun (part of the
            # suite run above) requires every SPK except SPK-13 to genuinely
            # report Passed:true, and SPK-13 to report exactly
            # PENDING_PEER_PLATFORM — a bare pass/fail boolean for the whole
            # suite doesn't show that explicitly per run, so capture this one
            # test's own -v output (its t.Logf prints "N SPKs genuinely
            # Passed:true, M correctly PENDING_PEER_PLATFORM") into its own
            # small, readable per-run log. This must fail the run (not be
            # silently swallowed) if the command itself fails to execute or
            # the expected summary line never appears — either would mean
            # this run's "13 PASS + 1 PENDING" evidence is missing, not just
            # unreadable.
            if ! go test -v -run '^TestDefaultScenariosFormAValidRegistryAndCleanRun$' -count=1 ./internal/spikeacceptance/... \
              > "stability-report/spk-summary-run-${i}.log" 2>&1; then
              run_passed=false
              all_stable=false
              echo "run ${i} SPK-summary re-run FAILED, see stability-report/spk-summary-run-${i}.log"
            elif ! grep -q "clean run:" "stability-report/spk-summary-run-${i}.log"; then
              run_passed=false
              all_stable=false
              echo "run ${i} SPK-summary log missing the expected \"clean run:\" confirmation"
            fi
            runs_json=$(echo "${runs_json}" | jq --argjson run "${i}" --argjson passed "${run_passed}" --argjson duration "${duration}" \
              '. + [{"run": $run, "passed": $passed, "durationSeconds": $duration}]')
          done

          jq -n \
            --argjson racePassed "${race_passed}" \
            --argjson raceDurationSeconds "$((race_end - race_start))" \
            --argjson spk08IterationCount "${spk08_iterations:-0}" \
            --argjson spk08Ok "${spk08_ok}" \
            --argjson runs "${runs_json}" \
            --argjson allTenRunsStable "${all_stable}" \
            --arg goos "$(go env GOOS)" \
            --arg goVersion "$(go version)" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              goos: $goos,
              goVersion: $goVersion,
              generatedAt: $generatedAt,
              raceDetector: {passed: $racePassed, durationSeconds: $raceDurationSeconds},
              spk08WriteLeaseRace: {iterationCount: $spk08IterationCount, meetsMinimum100: $spk08Ok},
              fullSuiteRuns: $runs,
              allTenRunsStable: $allTenRunsStable
            }' > stability-report/v0-12-stability-report.json

          echo "== aggregated stability report =="
          cat stability-report/v0-12-stability-report.json

          if [ "${race_passed}" != "true" ] || [ "${spk08_ok}" != "true" ] || [ "${all_stable}" != "true" ]; then
            echo "V0-12 stability gate FAILED — see stability-report/ artifact for the full report and per-run logs"
            exit 1
          fi

      - name: Upload V0-12 stability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0-12-stability-report
          path: stability-report/
          if-no-files-found: error
          retention-days: 7

  # spike-acceptance runs the real SPK-01..SPK-14 registry through the
  # standalone agentkit-spike binary (docs/spikes/01-go-core-spike-plan.md
  # §9, docs/design/02-v0-spike-verdict.md V0-10A..V0-10C) — never `go test`
  # wrapped as a pass/fail proxy. --assessment is the gate this job uses: it
  # exits 0 once the harness/evidence itself is complete (every SPK
  # dispatched, every bundle sealed and verified, the manifest valid) even
  # when SPK-13 (and, on a single platform, nothing else) reports false. A
  # harness failure — a missing handler, an unusable bundle, a malformed
  # manifest — is always a non-zero exit. "This job is green" therefore means
  # the acceptance mechanism itself works on this OS, not that every SPK
  # passed and never means GO (only V0-14 declares GO — see the note at the
  # bottom of docs/design/02-v0-spike-verdict.md's V0-11 section).
  spike-acceptance:
    name: spike acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: contract
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: Build acceptance binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          go build -o "bin/agentkit-spike${ext}" ./cmd/agentkit-spike
          go build -o "bin/fake-claude${ext}" ./cmd/fake-claude
          go build -o "bin/fake-codex${ext}" ./cmd/fake-codex
          go build -o "bin/spike-helper${ext}" ./cmd/spike-helper
          go build -o "bin/spike-worker${ext}" ./cmd/spike-worker

      - name: Run full SPK-01..SPK-14 registry (assessment mode)
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          ./bin/agentkit-spike${ext} acceptance --full --assessment \
            --evidence-dir spike-evidence \
            --fake-claude "bin/fake-claude${ext}" \
            --fake-codex "bin/fake-codex${ext}" \
            --spike-helper "bin/spike-helper${ext}" \
            --spike-worker "bin/spike-worker${ext}"

      # No separate "evidence verify" step here: Registry.RunAll
      # (internal/spikeacceptance/registry.go) already calls evidence.Verify
      # on every sealed per-SPK bundle before the acceptance command above
      # returns — a verification failure there is already a non-zero exit
      # from the previous step, in both --assessment and --require-all-pass
      # modes. `agentkit-spike evidence verify` is a separate CLI path for
      # the single-bundle --offline baseline, not full-suite bundles.

      # Uploaded even when a prior step fails (a harness error is exactly
      # what this evidence exists to diagnose), and always uploaded on
      # success so the semantic-diff job below has both platforms' manifests
      # to compare.
      - name: Upload platform manifest + evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-evidence-${{ matrix.os }}
          path: spike-evidence/
          if-no-files-found: error
          retention-days: 7

  # semantic-diff is the only place SPK-13 gets an authoritative result
  # (docs/design/02-v0-spike-verdict.md V0-10A/V0-11): a single platform run
  # cannot conclude Windows/Linux parity by itself, so this job downloads
  # both platforms' manifests spike-acceptance produced and runs
  # `agentkit-spike semantic-diff`, which compares every other SPK's result
  # field-by-field and writes SPK-13's real Passed value from that
  # comparison — never from a single-platform guess.
  semantic-diff:
    name: cross-platform semantic diff (SPK-13)
    runs-on: ubuntu-latest
    needs: spike-acceptance
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: Build agentkit-spike
        run: |
          mkdir -p bin
          go build -o bin/agentkit-spike ./cmd/agentkit-spike

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spike-evidence-windows-latest
          path: windows-evidence

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spike-evidence-ubuntu-latest
          path: ubuntu-evidence

      - name: Run semantic-diff and produce the SPK-13 authoritative result
        shell: bash
        run: |
          set -euo pipefail
          windows_manifest=$(ls windows-evidence/*-manifest.json)
          ubuntu_manifest=$(ls ubuntu-evidence/*-manifest.json)
          ./bin/agentkit-spike semantic-diff \
            --left "${windows_manifest}" \
            --right "${ubuntu_manifest}" \
            --out spk13-result.json \
            --evidence-dir spk13-evidence

      # Uploads both the plain-JSON convenience copy and the sealed,
      # checksum-verified evidence bundle (evidence.Verify already ran on it
      # inside the step above; a corrupt/incomplete bundle would already have
      # failed that step, so this upload never ships an unverified result).
      - name: Upload SPK-13 authoritative result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spk13-authoritative-result
          path: |
            spk13-result.json
            spk13-evidence/
          if-no-files-found: error
          retention-days: 7

  # v6-acceptance is V6-14B (docs/design/08-v6-api-projections.md V6-14B:
  # "cùng một semantic suite pass trên Windows/Linux với lifecycle hữu
  # hạn"): it runs the SAME V6-14 black-box journey
  # (internal/integration/v6accept, TestV6HTTPAcceptance_CleanDatabaseJourney)
  # on both platforms, real `aw serve` + `aw worker` processes end to end —
  # health/doctor/settings, adapter probe/register, project/repository,
  # workspace provisioning, a 4-role Run, ReleaseSet + a real local `git
  # commit`, evidence/artifact download, SSE projection + rebuild, restart
  # equality and graceful shutdown. It is budgeted separately from
  # `contract`/V0-12: this suite spawns real OS processes and does real
  # waits (workspace provisioning, run completion, projection rebuild,
  # restart), so it legitimately costs more per run than the offline unit
  # suite. Local measurement (see baocaov6checklist.md's own V6-14B section)
  # was ~20-33s wall on a contended Windows dev machine for the whole `go
  # test` invocation (build + all 14 stages); 20 minutes gives CI/Windows
  # overhead — and V6-14A's own future crash/race scenarios landing in this
  # same package — real headroom without matching `contract`'s tighter
  # budget.
  v6-acceptance:
    name: v6 acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: contract
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      # The suite builds cmd/aw and cmd/fake-claude itself (build_test.go)
      # and writes its own structured, OS-normalized result summary
      # (internal/integration/v6accept/report_test.go) to AW_V6_REPORT_PATH
      # — this is what v6-acceptance-diff below compares field-by-field
      # instead of diffing raw logs (which would differ on absolute paths,
      # ports, PIDs and timestamps even between two semantically identical
      # runs). The job's own exit code stays real: a genuine `go test`
      # failure exits this step non-zero and fails the job, even though the
      # upload step below still runs (if: always()) to capture whatever
      # evidence exists.
      - name: Run V6-14 black-box HTTP acceptance journey (V6-14B multi-platform)
        shell: bash
        env:
          AW_HTTP_ACCEPTANCE: '1'
          # Absolute on purpose: `go test` runs the test binary with the
          # PACKAGE directory as its working directory, so a relative value
          # here would not mean the same directory as this step's own
          # repo-root `mkdir`/`tail`/upload paths.
          AW_V6_REPORT_PATH: ${{ github.workspace }}/v6-report/report.json
        run: |
          set -uo pipefail
          mkdir -p v6-report
          go test -count=1 -v ./internal/integration/v6accept/... > v6-report/acceptance.log 2>&1
          status=$?
          echo "== last 200 lines of acceptance.log =="
          tail -n 200 v6-report/acceptance.log
          if [ ${status} -ne 0 ]; then
            echo "V6-14B acceptance suite FAILED on ${{ matrix.os }} (exit ${status}) — see the v6-acceptance-report-${{ matrix.os }} artifact"
            exit ${status}
          fi
          # Fail here, where the cause is visible, rather than letting a
          # green suite upload an artifact with no report.json in it and
          # having v6-acceptance-diff report "CHƯA ĐỦ EVIDENCE" two jobs
          # later for what is really a path bug in THIS step.
          if [ ! -f v6-report/report.json ]; then
            echo "V6-14B FAILED: the suite passed on ${{ matrix.os }} but wrote no report.json to ${AW_V6_REPORT_PATH} (nothing for the cross-platform diff to compare)"
            ls -la v6-report || true
            exit 1
          fi
          echo "== report.json (${{ matrix.os }}) =="
          cat v6-report/report.json
          echo "V6-14B acceptance suite passed on ${{ matrix.os }}"

      - name: Upload V6-14B acceptance report (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v6-acceptance-report-${{ matrix.os }}
          path: v6-report/
          if-no-files-found: error
          retention-days: 7

  # v6-acceptance-diff is V6-14B's own cross-platform comparison: it never
  # trusts a single platform's own green job conclusion, and it never treats
  # a missing platform artifact as a pass. `if: always()` means this job
  # still runs even when a v6-acceptance matrix leg failed or was cancelled
  # (fail-fast: false above keeps the OTHER leg's own artifact uploading
  # regardless), so a real "one platform's evidence is missing" situation is
  # always loudly reported by THIS job, in this job's own log, rather than
  # the whole workflow just showing one red matrix leg and a silently
  # skipped comparison.
  v6-acceptance-diff:
    name: v6 acceptance cross-platform diff
    runs-on: ubuntu-latest
    needs: v6-acceptance
    if: always()
    timeout-minutes: 10
    steps:
      # continue-on-error: true on both downloads below is deliberate: the
      # default download-artifact failure (a generic "artifact not found")
      # would abort the job before the comparison step gets to print its own
      # CHƯA ĐỦ EVIDENCE message. The comparison step itself checks for the
      # files' real presence and is what actually fails the job.
      - name: Download Windows v6 acceptance report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v6-acceptance-report-windows-latest
          path: windows-report

      - name: Download Linux v6 acceptance report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v6-acceptance-report-ubuntu-latest
          path: linux-report

      # Fail-closed, field-by-field comparison (docs/design/08-v6-api-projections.md
      # V6-14B "Không làm: unavailable platform is not silently marked
      # PASS" / "Verify: ... missing evidence = CHƯA ĐỦ EVIDENCE"):
      #   1. Either report file missing -> CHƯA ĐỦ EVIDENCE, naming which
      #      platform, non-zero exit. Never continue-on-error past this.
      #   2. Either report's own allPassed=false -> a REAL recorded failure
      #      (evidence present, just red), reported as such, non-zero exit.
      #   3. contractVersion differs -> the two runs are not evidence for
      #      the same suite/code version; reported field-by-field, non-zero
      #      exit.
      #   4. stages differ (normalized to name+passed only — durationMs is
      #      real but expected to differ machine-to-machine, so it is not
      #      part of the semantic comparison) -> non-zero exit, both sides
      #      logged.
      #   5. finalCounts differ -> non-zero exit, every differing key named
      #      with both values.
      #   6. Otherwise: one-line "both platforms agree on contract version
      #      <X>" confirmation.
      - name: Normalize and compare V6-14B platform reports (fail closed on missing evidence)
        shell: bash
        run: |
          set -uo pipefail
          windows_report="windows-report/report.json"
          linux_report="linux-report/report.json"

          missing=""
          if [ ! -f "${windows_report}" ]; then missing="${missing}windows-latest "; fi
          if [ ! -f "${linux_report}" ]; then missing="${missing}ubuntu-latest "; fi
          if [ -n "${missing}" ]; then
            echo "CHƯA ĐỦ EVIDENCE: missing V6-14B acceptance report(s) for: ${missing}(expected the v6-acceptance-report-<os> artifact from each platform's v6-acceptance job; an upstream job that never reached its upload-artifact step, or was skipped/cancelled, produces no artifact at all)"
            exit 1
          fi

          echo "== windows-latest report =="
          cat "${windows_report}"
          echo "== ubuntu-latest report =="
          cat "${linux_report}"

          win_all_passed=$(jq -r '.allPassed' "${windows_report}")
          linux_all_passed=$(jq -r '.allPassed' "${linux_report}")
          if [ "${win_all_passed}" != "true" ]; then
            echo "V6-14B FAILED: windows-latest report has allPassed=${win_all_passed} (a real recorded failure, not missing evidence — see the v6-acceptance-report-windows-latest artifact's acceptance.log)"
            exit 1
          fi
          if [ "${linux_all_passed}" != "true" ]; then
            echo "V6-14B FAILED: ubuntu-latest report has allPassed=${linux_all_passed} (a real recorded failure, not missing evidence — see the v6-acceptance-report-ubuntu-latest artifact's acceptance.log)"
            exit 1
          fi

          win_contract=$(jq -r '.contractVersion' "${windows_report}")
          linux_contract=$(jq -r '.contractVersion' "${linux_report}")
          if [ "${win_contract}" != "${linux_contract}" ]; then
            echo "V6-14B FAILED: field 'contractVersion' differs between platforms: windows-latest=${win_contract} ubuntu-latest=${linux_contract}"
            exit 1
          fi

          win_stages=$(jq -c '[.stages[] | {name, passed}]' "${windows_report}")
          linux_stages=$(jq -c '[.stages[] | {name, passed}]' "${linux_report}")
          if [ "${win_stages}" != "${linux_stages}" ]; then
            echo "V6-14B FAILED: field 'stages' (normalized to name+passed) differs between platforms"
            echo "  windows-latest: ${win_stages}"
            echo "  ubuntu-latest:  ${linux_stages}"
            exit 1
          fi

          win_counts=$(jq -c '.finalCounts' "${windows_report}")
          linux_counts=$(jq -c '.finalCounts' "${linux_report}")
          if [ "${win_counts}" != "${linux_counts}" ]; then
            echo "V6-14B FAILED: field 'finalCounts' differs between platforms"
            for key in $(jq -r '.finalCounts | keys[]' "${windows_report}" "${linux_report}" | sort -u); do
              wv=$(jq -r --arg k "${key}" '.finalCounts[$k] // "MISSING"' "${windows_report}")
              lv=$(jq -r --arg k "${key}" '.finalCounts[$k] // "MISSING"' "${linux_report}")
              if [ "${wv}" != "${lv}" ]; then
                echo "  finalCounts.${key}: windows-latest=${wv} ubuntu-latest=${lv}"
              fi
            done
            exit 1
          fi

          echo "both platforms agree on contract version ${win_contract} (V6-14B multi-platform acceptance PASS)"
