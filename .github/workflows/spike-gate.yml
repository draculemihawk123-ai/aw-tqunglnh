name: Go core spike gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Docs coverage gate (V1-00C pre-V1 aggregate gate)
        run: go run ./cmd/docs-coverage-check
      - name: Offline contract suite
        run: go test -count=1 ./...

      # V8-04E's own evidence step: internal/adapters/gitworktree,
      # internal/integration/v5accept and internal/delivery/httpapi (which
      # includes internal/delivery/httpapi/securitymatrix) already pass as
      # part of "Offline contract suite" above — this re-runs ONLY those
      # three package trees, on both platforms, with `-json` so the specific
      # named security tests V8-04A/B/C/D's own checklist entries cite as
      # their real, load-bearing evidence get a structured, per-test
      # artifact the v8-04e-gate job below can read — the identical
      # "standalone, human-readable/structured report on top of an already-
      # enforcing suite" precedent V0-13's own Boundary/dependency report
      # step (below) already established, generalized to `-json` instead of
      # `-v` because this one needs per-test outcomes, not just a log.
      # `if: always()` so this still runs (and reports real failures by
      # name) even if something unrelated already failed the suite above.
      - name: Security suite evidence (V8-04E)
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p security-evidence
          go test -count=1 -json ./internal/adapters/gitworktree/... ./internal/integration/v5accept/... ./internal/delivery/httpapi/... > security-evidence/security-evidence.jsonl 2> security-evidence/stderr.log
          status=$?
          printf '{"commit":"%s","goos":"%s"}\n' "${{ github.sha }}" "$(go env GOOS)" > security-evidence/meta.json
          echo "== last 100 lines of stderr (build errors, if any) =="
          tail -n 100 security-evidence/stderr.log || true
          if [ ${status} -ne 0 ]; then
            echo "V8-04E security suite evidence FAILED on ${{ matrix.os }} (exit ${status}) — see the v8-04e-evidence-${{ matrix.os }} artifact; the v8-04e-gate job reports which specific named test failed"
          fi
          exit ${status}

      - name: Upload V8-04E security suite evidence (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v8-04e-evidence-${{ matrix.os }}
          path: security-evidence/
          if-no-files-found: warn
          retention-days: 7

      # V0-11A diagnostic: the only place these timing-sensitive failures
      # (docs/design/02-v0-spike-verdict.md V0-11A) were ever observed is the
      # real windows-latest runner — neither reproduced locally. Repeat
      # exactly the tests that failed, on this same runner, well beyond their
      # normal single pass, to build real confidence in the fixes
      # (_txlock=immediate in internal/adapters/sqlite/db.go; the deterministic
      # waitPastLeaseUntil/waitPastWriteLeaseUntil wait in
      # spk09_workspace_quarantine_test.go and spk09_scenario.go) rather than
      # trusting one lucky green run.
      - name: Stress write-lease race path (Windows, V0-11A diagnostic)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go test -run '^TestWriteLeaseRaceHasOneWinnerForSameRepository$' -count=20 -timeout 120s ./internal/adapters/sqlite/...
          go test -run '^TestSPK09QuarantineRecreateFencesStaleGeneration$' -count=30 -timeout 120s ./internal/adapters/sqlite/...
          go test -run '^TestDefaultScenariosFormAValidRegistryAndCleanRun$' -count=5 -timeout 300s ./internal/spikeacceptance/...

      # V0-12 (docs/design/02-v0-spike-verdict.md): internal/archtest enforces
      # domain/app never depends on adapter/OS/provider specifics — a
      # violation already fails "Offline contract suite" above on both OS
      # (it is a real `go test ./...` package). This step additionally
      # produces a standalone, human-readable report artifact so the result
      # is traceable without digging through the full suite's log. Checks are
      # OS-independent (pure import-graph/AST/reflection analysis), so this
      # only needs to run once.
      - name: Boundary/dependency report (V0-13)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p boundary-report
          if go test -v ./internal/archtest/... > boundary-report/v0-13-boundary-report.log 2>&1; then
            echo "V0-13 boundary/dependency checks: all passed"
          else
            echo "V0-13 boundary/dependency checks FAILED — see boundary-report/v0-13-boundary-report.log"
            cat boundary-report/v0-13-boundary-report.log
            exit 1
          fi
          cat boundary-report/v0-13-boundary-report.log

      - name: Upload V0-13 boundary/dependency report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0-13-boundary-report
          path: boundary-report/
          if-no-files-found: error
          retention-days: 7

  # V0-12 (docs/design/02-v0-spike-verdict.md): race detector clean + 10 full
  # offline-suite runs not flaky, with SPK-08's own 100-iteration write-lease
  # race (internal/spikeacceptance/spk08_scenario.go) exercised inside every
  # one of those 10 runs via TestDefaultScenariosFormAValidRegistryAndCleanRun.
  # A failure anywhere in this job is a real signal to root-cause, never a
  # reason to just retry until it goes green.
  #
  # timeout-minutes is 35, not 25, and that number is measured rather than
  # guessed. This job's honest cost is one `-race` pass plus TEN full offline
  # suite runs plus ten SPK-summary re-runs; on the real runner that has been
  # 17-25 minutes across the sample below (all `Linux race and stability
  # (V0-12)`, 2026-09-22, after the internal/adapters/sqlite template-database
  # speedup that fixed the genuine >600s per-package -race regression):
  #
  #   run 35689894700  success  24m55s
  #   run 35694219575  success  24m53s
  #   run 35698895318  success  17m47s
  #   run 35702529465  success  17m29s
  #   run 35703724072  success  21m19s
  #   run 35716861008  success  21m44s
  #   run 35720884832  CANCELED at the 25m cap
  #
  # Two of those passed with five and seven SECONDS of headroom. A cap inside
  # the job's own natural spread turns ordinary runner variance into a red
  # gate on a PR that changed nothing relevant, which trains exactly the
  # "retry until green" reflex the comment above forbids — and it hides the
  # signal that matters, because a timeout and a real hang look identical.
  # 35 minutes sits clear of the observed spread while still failing fast on
  # a genuine deadlock. It is a budget for work this job really does; it is
  # NOT permission to let the job get slower. If a future run approaches 35
  # minutes, root-cause it (as the sqlite -race regression was root-caused)
  # instead of raising this number again.
  linux-race-and-stability:
    name: Linux race and stability (V0-12)
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: Race detector and 10x offline-suite stability, aggregated report
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p stability-report

          echo "== race detector (go test -race -count=1 ./...) =="
          race_start=$(date +%s)
          if go test -race -count=1 ./... > stability-report/race-detector.log 2>&1; then
            race_passed=true
          else
            race_passed=false
          fi
          race_end=$(date +%s)
          cat stability-report/race-detector.log
          echo "race detector passed=${race_passed} duration=$((race_end - race_start))s"

          echo "== SPK-08 write-lease race iteration count (static check) =="
          spk08_iterations=$(grep -oP 'iterations\s*=\s*\K\d+' internal/spikeacceptance/spk08_scenario.go | head -n1)
          if [ -z "${spk08_iterations}" ] || [ "${spk08_iterations}" -lt 100 ]; then
            echo "SPK-08 iteration count check FAILED: found '${spk08_iterations}', want >= 100"
            spk08_ok=false
          else
            echo "SPK-08 iteration count = ${spk08_iterations} (>= 100, required in every one of the 10 runs below via TestDefaultScenariosFormAValidRegistryAndCleanRun)"
            spk08_ok=true
          fi

          echo "== 10x full offline suite, no retry-until-green =="
          runs_json="[]"
          all_stable=true
          for i in $(seq 1 10); do
            echo "-- offline suite run ${i}/10 --"
            run_start=$(date +%s)
            if go test -count=1 ./... > "stability-report/suite-run-${i}.log" 2>&1; then
              run_passed=true
            else
              run_passed=false
              all_stable=false
              echo "run ${i} FAILED, see stability-report/suite-run-${i}.log"
              tail -n 60 "stability-report/suite-run-${i}.log"
            fi
            run_end=$(date +%s)
            duration=$((run_end - run_start))
            echo "run ${i}/10 passed=${run_passed} duration=${duration}s"

            # TestDefaultScenariosFormAValidRegistryAndCleanRun (part of the
            # suite run above) requires every SPK except SPK-13 to genuinely
            # report Passed:true, and SPK-13 to report exactly
            # PENDING_PEER_PLATFORM — a bare pass/fail boolean for the whole
            # suite doesn't show that explicitly per run, so capture this one
            # test's own -v output (its t.Logf prints "N SPKs genuinely
            # Passed:true, M correctly PENDING_PEER_PLATFORM") into its own
            # small, readable per-run log. This must fail the run (not be
            # silently swallowed) if the command itself fails to execute or
            # the expected summary line never appears — either would mean
            # this run's "13 PASS + 1 PENDING" evidence is missing, not just
            # unreadable.
            if ! go test -v -run '^TestDefaultScenariosFormAValidRegistryAndCleanRun$' -count=1 ./internal/spikeacceptance/... \
              > "stability-report/spk-summary-run-${i}.log" 2>&1; then
              run_passed=false
              all_stable=false
              echo "run ${i} SPK-summary re-run FAILED, see stability-report/spk-summary-run-${i}.log"
            elif ! grep -q "clean run:" "stability-report/spk-summary-run-${i}.log"; then
              run_passed=false
              all_stable=false
              echo "run ${i} SPK-summary log missing the expected \"clean run:\" confirmation"
            fi
            runs_json=$(echo "${runs_json}" | jq --argjson run "${i}" --argjson passed "${run_passed}" --argjson duration "${duration}" \
              '. + [{"run": $run, "passed": $passed, "durationSeconds": $duration}]')
          done

          jq -n \
            --argjson racePassed "${race_passed}" \
            --argjson raceDurationSeconds "$((race_end - race_start))" \
            --argjson spk08IterationCount "${spk08_iterations:-0}" \
            --argjson spk08Ok "${spk08_ok}" \
            --argjson runs "${runs_json}" \
            --argjson allTenRunsStable "${all_stable}" \
            --arg goos "$(go env GOOS)" \
            --arg goVersion "$(go version)" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              goos: $goos,
              goVersion: $goVersion,
              generatedAt: $generatedAt,
              raceDetector: {passed: $racePassed, durationSeconds: $raceDurationSeconds},
              spk08WriteLeaseRace: {iterationCount: $spk08IterationCount, meetsMinimum100: $spk08Ok},
              fullSuiteRuns: $runs,
              allTenRunsStable: $allTenRunsStable
            }' > stability-report/v0-12-stability-report.json

          echo "== aggregated stability report =="
          cat stability-report/v0-12-stability-report.json

          if [ "${race_passed}" != "true" ] || [ "${spk08_ok}" != "true" ] || [ "${all_stable}" != "true" ]; then
            echo "V0-12 stability gate FAILED — see stability-report/ artifact for the full report and per-run logs"
            exit 1
          fi

      - name: Upload V0-12 stability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0-12-stability-report
          path: stability-report/
          if-no-files-found: error
          retention-days: 7

  # v8-concurrency-soak is V8-03 (docs/design/10-v8-alpha-hardening.md V8-03,
  # AK-ARCH-009/GC-ACC-09): TestV8ConcurrencySoak_MultiFamilyRaceInvariants
  # (internal/integration/v6accept/concurrency_soak_test.go) repeated 10
  # times, no retry-until-green — mirrors `linux-race-and-stability` (V0-12)
  # above's own established "10x + race detector, aggregated report"
  # convention, applied to this task's own real multi-family concurrency
  # scenario instead of the whole offline suite. `-race` only on
  # ubuntu-latest, matching V0-12's own platform choice (this repo has never
  # run `-race` on windows-latest); windows-latest still gets its own 10x
  # repeat without `-race` for the leak/flake half of V8-03's own Verify
  # line ("leak/flake report Windows/Linux"), plus every job below already
  # exercises the SAME real-process topology.
  v8-concurrency-soak-race:
    name: v8 concurrency soak + race (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: 10x concurrency soak with race detector, aggregated report
        shell: bash
        env:
          AW_HTTP_ACCEPTANCE: '1'
        run: |
          set -uo pipefail
          mkdir -p soak-report
          runs_json="[]"
          all_stable=true
          for i in $(seq 1 10); do
            echo "-- concurrency soak run ${i}/10 (race) --"
            run_start=$(date +%s)
            if go test -race -count=1 -v -run '^TestV8ConcurrencySoak_MultiFamilyRaceInvariants$' -timeout 5m \
              ./internal/integration/v6accept/... > "soak-report/run-${i}.log" 2>&1; then
              run_passed=true
            else
              run_passed=false
              all_stable=false
              echo "run ${i} FAILED, see soak-report/run-${i}.log"
              tail -n 100 "soak-report/run-${i}.log"
            fi
            run_end=$(date +%s)
            duration=$((run_end - run_start))
            echo "run ${i}/10 passed=${run_passed} duration=${duration}s"
            runs_json=$(echo "${runs_json}" | jq --argjson run "${i}" --argjson passed "${run_passed}" --argjson duration "${duration}" \
              '. + [{"run": $run, "passed": $passed, "durationSeconds": $duration}]')
          done

          jq -n \
            --argjson runs "${runs_json}" \
            --argjson allTenRunsStable "${all_stable}" \
            --arg goos "$(go env GOOS)" \
            --arg raceEnabled "true" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{goos: $goos, raceEnabled: $raceEnabled, generatedAt: $generatedAt, runs: $runs, allTenRunsStable: $allTenRunsStable}' \
            > soak-report/v8-03-soak-report.json
          echo "== aggregated soak report =="
          cat soak-report/v8-03-soak-report.json

          if [ "${all_stable}" != "true" ]; then
            echo "V8-03 concurrency soak FAILED — see the v8-concurrency-soak-report-ubuntu-latest artifact for per-run logs"
            exit 1
          fi

      - name: Upload V8-03 concurrency soak report (ubuntu-latest)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v8-concurrency-soak-report-ubuntu-latest
          path: soak-report/
          if-no-files-found: error
          retention-days: 7

  v8-concurrency-soak-windows:
    name: v8 concurrency soak (windows-latest)
    runs-on: windows-latest
    needs: contract
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: 10x concurrency soak (no race — leak/flake check), aggregated report
        shell: bash
        env:
          AW_HTTP_ACCEPTANCE: '1'
        run: |
          set -uo pipefail
          mkdir -p soak-report
          runs_json="[]"
          all_stable=true
          for i in $(seq 1 10); do
            echo "-- concurrency soak run ${i}/10 --"
            run_start=$(date +%s)
            if go test -count=1 -v -run '^TestV8ConcurrencySoak_MultiFamilyRaceInvariants$' -timeout 5m \
              ./internal/integration/v6accept/... > "soak-report/run-${i}.log" 2>&1; then
              run_passed=true
            else
              run_passed=false
              all_stable=false
              echo "run ${i} FAILED, see soak-report/run-${i}.log"
              tail -n 100 "soak-report/run-${i}.log"
            fi
            run_end=$(date +%s)
            duration=$((run_end - run_start))
            echo "run ${i}/10 passed=${run_passed} duration=${duration}s"
            runs_json=$(echo "${runs_json}" | jq --argjson run "${i}" --argjson passed "${run_passed}" --argjson duration "${duration}" \
              '. + [{"run": $run, "passed": $passed, "durationSeconds": $duration}]')
          done

          jq -n \
            --argjson runs "${runs_json}" \
            --argjson allTenRunsStable "${all_stable}" \
            --arg goos "$(go env GOOS)" \
            --arg raceEnabled "false" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{goos: $goos, raceEnabled: $raceEnabled, generatedAt: $generatedAt, runs: $runs, allTenRunsStable: $allTenRunsStable}' \
            > soak-report/v8-03-soak-report.json
          echo "== aggregated soak report =="
          cat soak-report/v8-03-soak-report.json

          if [ "${all_stable}" != "true" ]; then
            echo "V8-03 concurrency soak FAILED on windows-latest — see the v8-concurrency-soak-report-windows-latest artifact for per-run logs"
            exit 1
          fi

      - name: Upload V8-03 concurrency soak report (windows-latest)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v8-concurrency-soak-report-windows-latest
          path: soak-report/
          if-no-files-found: error
          retention-days: 7

  # spike-acceptance runs the real SPK-01..SPK-14 registry through the
  # standalone agentkit-spike binary (docs/spikes/01-go-core-spike-plan.md
  # §9, docs/design/02-v0-spike-verdict.md V0-10A..V0-10C) — never `go test`
  # wrapped as a pass/fail proxy. --assessment is the gate this job uses: it
  # exits 0 once the harness/evidence itself is complete (every SPK
  # dispatched, every bundle sealed and verified, the manifest valid) even
  # when SPK-13 (and, on a single platform, nothing else) reports false. A
  # harness failure — a missing handler, an unusable bundle, a malformed
  # manifest — is always a non-zero exit. "This job is green" therefore means
  # the acceptance mechanism itself works on this OS, not that every SPK
  # passed and never means GO (only V0-14 declares GO — see the note at the
  # bottom of docs/design/02-v0-spike-verdict.md's V0-11 section).
  spike-acceptance:
    name: spike acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: contract
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: Build acceptance binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          go build -o "bin/agentkit-spike${ext}" ./cmd/agentkit-spike
          go build -o "bin/fake-claude${ext}" ./cmd/fake-claude
          go build -o "bin/fake-codex${ext}" ./cmd/fake-codex
          go build -o "bin/spike-helper${ext}" ./cmd/spike-helper
          go build -o "bin/spike-worker${ext}" ./cmd/spike-worker

      - name: Run full SPK-01..SPK-14 registry (assessment mode)
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          ./bin/agentkit-spike${ext} acceptance --full --assessment \
            --evidence-dir spike-evidence \
            --fake-claude "bin/fake-claude${ext}" \
            --fake-codex "bin/fake-codex${ext}" \
            --spike-helper "bin/spike-helper${ext}" \
            --spike-worker "bin/spike-worker${ext}"

      # No separate "evidence verify" step here: Registry.RunAll
      # (internal/spikeacceptance/registry.go) already calls evidence.Verify
      # on every sealed per-SPK bundle before the acceptance command above
      # returns — a verification failure there is already a non-zero exit
      # from the previous step, in both --assessment and --require-all-pass
      # modes. `agentkit-spike evidence verify` is a separate CLI path for
      # the single-bundle --offline baseline, not full-suite bundles.

      # Uploaded even when a prior step fails (a harness error is exactly
      # what this evidence exists to diagnose), and always uploaded on
      # success so the semantic-diff job below has both platforms' manifests
      # to compare.
      - name: Upload platform manifest + evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-evidence-${{ matrix.os }}
          path: spike-evidence/
          if-no-files-found: error
          retention-days: 7

  # semantic-diff is the only place SPK-13 gets an authoritative result
  # (docs/design/02-v0-spike-verdict.md V0-10A/V0-11): a single platform run
  # cannot conclude Windows/Linux parity by itself, so this job downloads
  # both platforms' manifests spike-acceptance produced and runs
  # `agentkit-spike semantic-diff`, which compares every other SPK's result
  # field-by-field and writes SPK-13's real Passed value from that
  # comparison — never from a single-platform guess.
  semantic-diff:
    name: cross-platform semantic diff (SPK-13)
    runs-on: ubuntu-latest
    needs: spike-acceptance
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: Build agentkit-spike
        run: |
          mkdir -p bin
          go build -o bin/agentkit-spike ./cmd/agentkit-spike

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spike-evidence-windows-latest
          path: windows-evidence

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spike-evidence-ubuntu-latest
          path: ubuntu-evidence

      - name: Run semantic-diff and produce the SPK-13 authoritative result
        shell: bash
        run: |
          set -euo pipefail
          windows_manifest=$(ls windows-evidence/*-manifest.json)
          ubuntu_manifest=$(ls ubuntu-evidence/*-manifest.json)
          ./bin/agentkit-spike semantic-diff \
            --left "${windows_manifest}" \
            --right "${ubuntu_manifest}" \
            --out spk13-result.json \
            --evidence-dir spk13-evidence

      # Uploads both the plain-JSON convenience copy and the sealed,
      # checksum-verified evidence bundle (evidence.Verify already ran on it
      # inside the step above; a corrupt/incomplete bundle would already have
      # failed that step, so this upload never ships an unverified result).
      - name: Upload SPK-13 authoritative result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spk13-authoritative-result
          path: |
            spk13-result.json
            spk13-evidence/
          if-no-files-found: error
          retention-days: 7

  # v6-acceptance is V6-14B (docs/design/08-v6-api-projections.md V6-14B:
  # "cùng một semantic suite pass trên Windows/Linux với lifecycle hữu
  # hạn"): it runs the SAME V6-14 black-box journey
  # (internal/integration/v6accept, TestV6HTTPAcceptance_CleanDatabaseJourney)
  # on both platforms, real `aw serve` + `aw worker` processes end to end —
  # health/doctor/settings, adapter probe/register, project/repository,
  # workspace provisioning, a 4-role Run, ReleaseSet + a real local `git
  # commit`, evidence/artifact download, SSE projection + rebuild, restart
  # equality and graceful shutdown. It is budgeted separately from
  # `contract`/V0-12: this suite spawns real OS processes and does real
  # waits (workspace provisioning, run completion, projection rebuild,
  # restart), so it legitimately costs more per run than the offline unit
  # suite. Local measurement (see baocaov6checklist.md's own V6-14B section)
  # was ~20-33s wall on a contended Windows dev machine for the whole `go
  # test` invocation (build + all 14 stages); 20 minutes gives CI/Windows
  # overhead — and V6-14A's own future crash/race scenarios landing in this
  # same package — real headroom without matching `contract`'s tighter
  # budget.
  v6-acceptance:
    name: v6 acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: contract
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      # The suite builds cmd/aw and cmd/fake-claude itself (build_test.go)
      # and writes its own structured, OS-normalized result summary
      # (internal/integration/v6accept/report_test.go) to AW_V6_REPORT_PATH
      # — this is what v6-acceptance-diff below compares field-by-field
      # instead of diffing raw logs (which would differ on absolute paths,
      # ports, PIDs and timestamps even between two semantically identical
      # runs). The job's own exit code stays real: a genuine `go test`
      # failure exits this step non-zero and fails the job, even though the
      # upload step below still runs (if: always()) to capture whatever
      # evidence exists.
      - name: Run V6-14 black-box HTTP acceptance journey (V6-14B multi-platform)
        shell: bash
        env:
          AW_HTTP_ACCEPTANCE: '1'
          # Absolute on purpose: `go test` runs the test binary with the
          # PACKAGE directory as its working directory, so a relative value
          # here would not mean the same directory as this step's own
          # repo-root `mkdir`/`tail`/upload paths.
          AW_V6_REPORT_PATH: ${{ github.workspace }}/v6-report/report.json
        run: |
          # `set +e` is deliberate and load-bearing. GitHub runs a `shell:
          # bash` step with `-e` ALREADY SET (the runner's own
          # `bash --noprofile --norc -e -o pipefail`), and `set -uo pipefail`
          # does not clear it. Without this line the `go test` below aborts
          # the whole step the instant it fails, so `status=$?` never runs,
          # the acceptance log is never tailed, and the explicit failure
          # message below is never printed — the step just reports a bare
          # "exit code 1" and the only way to learn WHICH test failed is to
          # download the artifact. That is exactly what happened on the
          # windows-latest leg of V6-14A's first real run; this is the fix.
          set +e
          set -uo pipefail
          mkdir -p v6-report
          # -timeout 15m, not `go test`'s own 10-minute default, which this
          # package outgrew the moment V6-14A's scenarios joined V6-14B's
          # journey in it. The default applies to the WHOLE package binary,
          # and this one spawns real `aw serve`/`aw worker` processes and
          # does real waits; on windows-latest the full set has taken 372s
          # and then 600s+ on consecutive runs of identical code.
          #
          # 15m is deliberately BELOW this job's own timeout-minutes: 20,
          # and the ordering matters. Whichever limit fires first decides
          # what the evidence looks like: Go's own timeout prints `panic:
          # test timed out` with the goroutine dump and names every test
          # still running, while the job timeout just cancels the runner and
          # leaves nothing to read. Keeping Go's limit first means a real
          # hang is always diagnosable, with ~5 minutes left over for the
          # checkout, toolchain setup, compile and artifact upload that sit
          # outside this command.
          go test -count=1 -v -timeout 15m ./internal/integration/v6accept/... > v6-report/acceptance.log 2>&1
          status=$?

          # The same single run, also in machine-readable form, for V6-14C's
          # gate. `go tool test2json` is the exact converter `go test -json`
          # uses internally, so this is a faithful re-encoding of the log
          # above rather than a second, separately-scheduled test run whose
          # results could disagree with it.
          #
          # V6-14C needs per-SCENARIO outcomes, which no other artifact
          # carries: report.json describes the journey test's own 14 stages
          # and says nothing about the eleven fault scenarios beside it —
          # the same gap that once let this workflow's comparison job go
          # green while this job was red.
          go tool test2json -t < v6-report/acceptance.log > v6-report/acceptance.jsonl || true

          # Which revision this evidence describes. Without it a gate cannot
          # tell current evidence from a stale artifact that happens to be
          # lying next to it.
          printf '{"commit":"%s","goos":"%s","platform":"%s"}\n' \
            "${{ github.sha }}" "$(go env GOOS)" "${{ matrix.os }}" > v6-report/meta.json

          echo "== last 200 lines of acceptance.log =="
          tail -n 200 v6-report/acceptance.log
          if [ ${status} -ne 0 ]; then
            echo "V6-14B acceptance suite FAILED on ${{ matrix.os }} (exit ${status}) — see the v6-acceptance-report-${{ matrix.os }} artifact"
            exit ${status}
          fi
          # Fail here, where the cause is visible, rather than letting a
          # green suite upload an artifact with no report.json in it and
          # having v6-acceptance-diff report "CHƯA ĐỦ EVIDENCE" two jobs
          # later for what is really a path bug in THIS step.
          if [ ! -f v6-report/report.json ]; then
            echo "V6-14B FAILED: the suite passed on ${{ matrix.os }} but wrote no report.json to ${AW_V6_REPORT_PATH} (nothing for the cross-platform diff to compare)"
            ls -la v6-report || true
            exit 1
          fi
          echo "== report.json (${{ matrix.os }}) =="
          cat v6-report/report.json
          echo "V6-14B acceptance suite passed on ${{ matrix.os }}"

      - name: Upload V6-14B acceptance report (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v6-acceptance-report-${{ matrix.os }}
          path: v6-report/
          if-no-files-found: error
          retention-days: 7

  # v8-fault-matrix is V8-02 (docs/design/10-v8-alpha-hardening.md V8-02,
  # GC-ACC-16): SPK-04's own six standard crash-transaction boundaries
  # (docs/spikes/01-go-core-spike-plan.md §9), already proven at the spike
  # level (this same workflow's own `spike acceptance` job), re-run here
  # against a REAL `aw worker` process's own reaper/scheduler loop — proving
  # the production binary itself, not just the underlying SQLite
  # transactions SPK-04 already covers, genuinely reclaims a crashed job at
  # every one of the six boundaries with no lost job and no duplicated
  # authoritative outcome. Self-contained like `spike-acceptance`/
  # `v6-acceptance` above: internal/integration/v8fault's own build_test.go
  # builds cmd/aw + cmd/spike-worker itself, so this job only needs Go and
  # the AW_HTTP_ACCEPTANCE=1 opt-in every real-process suite in this repo
  # already uses.
  v8-fault-matrix:
    name: v8 fault matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: contract
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: Run V8-02 fault-injection matrix (six crash boundaries, real aw worker recovery)
        shell: bash
        env:
          AW_HTTP_ACCEPTANCE: '1'
        run: |
          set +e
          set -uo pipefail
          mkdir -p v8fault-report
          go test -count=1 -v -timeout 10m ./internal/integration/v8fault/... > v8fault-report/fault-matrix.log 2>&1
          status=$?
          echo "== last 300 lines of fault-matrix.log =="
          tail -n 300 v8fault-report/fault-matrix.log
          if [ ${status} -ne 0 ]; then
            echo "V8-02 fault-injection matrix FAILED on ${{ matrix.os }} (exit ${status}) — see the v8-fault-matrix-report-${{ matrix.os }} artifact"
            exit ${status}
          fi
          echo "V8-02 fault-injection matrix passed on ${{ matrix.os }}"

      - name: Upload V8-02 fault-matrix report (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v8-fault-matrix-report-${{ matrix.os }}
          path: v8fault-report/
          if-no-files-found: error
          retention-days: 7

  # v6-acceptance-diff is V6-14B's own cross-platform comparison: it never
  # trusts a single platform's own green job conclusion, and it never treats
  # a missing platform artifact as a pass. `if: always()` means this job
  # still runs even when a v6-acceptance matrix leg failed or was cancelled
  # (fail-fast: false above keeps the OTHER leg's own artifact uploading
  # regardless), so a real "one platform's evidence is missing" situation is
  # always loudly reported by THIS job, in this job's own log, rather than
  # the whole workflow just showing one red matrix leg and a silently
  # skipped comparison.
  v6-acceptance-diff:
    name: v6 acceptance cross-platform diff
    runs-on: ubuntu-latest
    needs: v6-acceptance
    if: always()
    timeout-minutes: 10
    steps:
      # continue-on-error: true on both downloads below is deliberate: the
      # default download-artifact failure (a generic "artifact not found")
      # would abort the job before the comparison step gets to print its own
      # CHƯA ĐỦ EVIDENCE message. The comparison step itself checks for the
      # files' real presence and is what actually fails the job.
      - name: Download Windows v6 acceptance report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v6-acceptance-report-windows-latest
          path: windows-report

      - name: Download Linux v6 acceptance report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v6-acceptance-report-ubuntu-latest
          path: linux-report

      # Fail-closed, field-by-field comparison (docs/design/08-v6-api-projections.md
      # V6-14B "Không làm: unavailable platform is not silently marked
      # PASS" / "Verify: ... missing evidence = CHƯA ĐỦ EVIDENCE"):
      #   1. Either report file missing -> CHƯA ĐỦ EVIDENCE, naming which
      #      platform, non-zero exit. Never continue-on-error past this.
      #   2. Either report's own allPassed=false -> a REAL recorded failure
      #      (evidence present, just red), reported as such, non-zero exit.
      #   3. contractVersion differs -> the two runs are not evidence for
      #      the same suite/code version; reported field-by-field, non-zero
      #      exit.
      #   4. stages differ (normalized to name+passed only — durationMs is
      #      real but expected to differ machine-to-machine, so it is not
      #      part of the semantic comparison) -> non-zero exit, both sides
      #      logged.
      #   5. finalCounts differ -> non-zero exit, every differing key named
      #      with both values.
      #   6. Otherwise: one-line "both platforms agree on contract version
      #      <X>" confirmation.
      - name: Normalize and compare V6-14B platform reports (fail closed on missing evidence)
        shell: bash
        run: |
          set -uo pipefail
          windows_report="windows-report/report.json"
          linux_report="linux-report/report.json"

          # FIRST, before trusting any report's own contents: did the
          # acceptance jobs that PRODUCED those reports actually succeed?
          #
          # The report is written by TestV6HTTPAcceptance_CleanDatabaseJourney's
          # own t.Cleanup and its `allPassed` therefore describes that one
          # test's 14 stages — nothing else in the package. Once V6-14A added
          # its own top-level fault scenarios to the SAME package, a failing
          # scenario could fail the `go test` invocation, and the job, while
          # the journey itself passed and its report still said
          # allPassed:true. That is exactly what happened on V6-14A's first
          # real run: `v6 acceptance (windows-latest)` was RED and this
          # comparison job went GREEN, because both reports honestly said
          # allPassed:true about the journey.
          #
          # A gate whose whole purpose is to fail closed cannot be green while
          # the thing it gates is red, so the upstream job result is checked
          # here as evidence in its own right. For a matrix job, `result` is
          # success only when EVERY leg succeeded.
          upstream="${{ needs.v6-acceptance.result }}"
          if [ "${upstream}" != "success" ]; then
            echo "V6-14B FAILED: the v6-acceptance matrix did not succeed (result=${upstream}), so this comparison cannot report PASS no matter what the uploaded reports say — the report's own allPassed covers only the journey's 14 stages, not the other top-level tests in that package. Open the red v6-acceptance job, or its v6-acceptance-report-<os> artifact's acceptance.log, for the failing test."
            exit 1
          fi

          missing=""
          if [ ! -f "${windows_report}" ]; then missing="${missing}windows-latest "; fi
          if [ ! -f "${linux_report}" ]; then missing="${missing}ubuntu-latest "; fi
          if [ -n "${missing}" ]; then
            echo "CHƯA ĐỦ EVIDENCE: missing V6-14B acceptance report(s) for: ${missing}(expected the v6-acceptance-report-<os> artifact from each platform's v6-acceptance job; an upstream job that never reached its upload-artifact step, or was skipped/cancelled, produces no artifact at all)"
            exit 1
          fi

          echo "== windows-latest report =="
          cat "${windows_report}"
          echo "== ubuntu-latest report =="
          cat "${linux_report}"

          win_all_passed=$(jq -r '.allPassed' "${windows_report}")
          linux_all_passed=$(jq -r '.allPassed' "${linux_report}")
          if [ "${win_all_passed}" != "true" ]; then
            echo "V6-14B FAILED: windows-latest report has allPassed=${win_all_passed} (a real recorded failure, not missing evidence — see the v6-acceptance-report-windows-latest artifact's acceptance.log)"
            exit 1
          fi
          if [ "${linux_all_passed}" != "true" ]; then
            echo "V6-14B FAILED: ubuntu-latest report has allPassed=${linux_all_passed} (a real recorded failure, not missing evidence — see the v6-acceptance-report-ubuntu-latest artifact's acceptance.log)"
            exit 1
          fi

          win_contract=$(jq -r '.contractVersion' "${windows_report}")
          linux_contract=$(jq -r '.contractVersion' "${linux_report}")
          if [ "${win_contract}" != "${linux_contract}" ]; then
            echo "V6-14B FAILED: field 'contractVersion' differs between platforms: windows-latest=${win_contract} ubuntu-latest=${linux_contract}"
            exit 1
          fi

          win_stages=$(jq -c '[.stages[] | {name, passed}]' "${windows_report}")
          linux_stages=$(jq -c '[.stages[] | {name, passed}]' "${linux_report}")
          if [ "${win_stages}" != "${linux_stages}" ]; then
            echo "V6-14B FAILED: field 'stages' (normalized to name+passed) differs between platforms"
            echo "  windows-latest: ${win_stages}"
            echo "  ubuntu-latest:  ${linux_stages}"
            exit 1
          fi

          win_counts=$(jq -c '.finalCounts' "${windows_report}")
          linux_counts=$(jq -c '.finalCounts' "${linux_report}")
          if [ "${win_counts}" != "${linux_counts}" ]; then
            echo "V6-14B FAILED: field 'finalCounts' differs between platforms"
            for key in $(jq -r '.finalCounts | keys[]' "${windows_report}" "${linux_report}" | sort -u); do
              wv=$(jq -r --arg k "${key}" '.finalCounts[$k] // "MISSING"' "${windows_report}")
              lv=$(jq -r --arg k "${key}" '.finalCounts[$k] // "MISSING"' "${linux_report}")
              if [ "${wv}" != "${lv}" ]; then
                echo "  finalCounts.${key}: windows-latest=${wv} ubuntu-latest=${lv}"
              fi
            done
            exit 1
          fi

          echo "both platforms agree on contract version ${win_contract} (V6-14B multi-platform acceptance PASS)"

  # v6-gate is V6-14C (docs/design/08-v6-api-projections.md V6-14C: "phát một
  # verdict từ evidence happy/fault/platform đầy đủ trước gate terminal",
  # verified by "one reproducible gate command over all artifacts"). It runs
  # no tests of its own: it downloads what the jobs above produced and reads
  # it against this checkout.
  #
  # `if: always()` is required, not convenient. The single most important
  # thing this gate says is "CHƯA ĐỦ EVIDENCE", and it can only say it when
  # it still runs after an upstream job failed or was cancelled — a gate that
  # is skipped whenever something upstream breaks reports nothing in exactly
  # the situation that most needs reporting.
  v6-gate:
    name: V6-14C API/projection verdict
    runs-on: ubuntu-latest
    needs: [contract, linux-race-and-stability, v6-acceptance, v6-acceptance-diff]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      # continue-on-error on every download, for the same reason the
      # comparison job uses it: a missing artifact must reach the gate as
      # missing EVIDENCE, reported by the gate in its own words with the Task
      # ID that owns it, rather than aborting this job with a generic
      # "artifact not found" before the gate ever runs.
      - name: Download acceptance evidence (ubuntu-latest)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v6-acceptance-report-ubuntu-latest
          path: evidence/v6-acceptance-report-ubuntu-latest

      - name: Download acceptance evidence (windows-latest)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v6-acceptance-report-windows-latest
          path: evidence/v6-acceptance-report-windows-latest

      - name: Download V0-12 stability evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v0-12-stability-report
          path: evidence/v0-12-stability-report

      - name: Emit the V6-14C verdict
        shell: bash
        run: |
          set -uo pipefail
          go run ./cmd/v6-gate \
            --evidence-dir evidence \
            --repo-root . \
            --commit "${{ github.sha }}" \
            --out verdict.json

      - name: Upload the V6-14C verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v6-14c-verdict
          path: verdict.json
          if-no-files-found: warn
          retention-days: 7

  # V8-04E — "Security aggregate gate" (docs/design/10-v8-alpha-hardening.md
  # V8-04E: "một verdict duy nhất trên bốn suite" — one verdict over the four
  # V8-04A..D security suites). Mirrors v6-gate's own structure exactly: a
  # pure reader over already-produced CI artifacts, never a test run of its
  # own. needs both `contract` (the new v8-04e-evidence-<os> artifact) and
  # `v6-acceptance` (the pre-existing v6-acceptance-report-<os> artifact,
  # which V8-04A's own two v6accept-hosted tests ride for free) — `if:
  # always()` so a real failure in either still reaches this gate as a named
  # finding rather than the gate itself being skipped as collateral damage.
  v8-04e-gate:
    name: V8-04E security aggregate gate
    runs-on: ubuntu-latest
    needs: [contract, v6-acceptance]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      # continue-on-error on every download, for the same reason v6-gate's
      # own downloads use it: a missing artifact must reach the gate as
      # missing EVIDENCE, reported by the gate in its own words with the
      # Task ID that owns it, rather than aborting this job before the gate
      # ever runs.
      - name: Download v6-acceptance evidence (ubuntu-latest)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v6-acceptance-report-ubuntu-latest
          path: evidence/v6-acceptance-report-ubuntu-latest

      - name: Download v6-acceptance evidence (windows-latest)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v6-acceptance-report-windows-latest
          path: evidence/v6-acceptance-report-windows-latest

      - name: Download V8-04E security suite evidence (ubuntu-latest)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v8-04e-evidence-ubuntu-latest
          path: evidence/v8-04e-evidence-ubuntu-latest

      - name: Download V8-04E security suite evidence (windows-latest)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: v8-04e-evidence-windows-latest
          path: evidence/v8-04e-evidence-windows-latest

      - name: Emit the V8-04E verdict
        shell: bash
        run: |
          set -uo pipefail
          go run ./cmd/v8-security-gate \
            --evidence-dir evidence \
            --commit "${{ github.sha }}" \
            --out verdict.json

      - name: Upload the V8-04E verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v8-04e-verdict
          path: verdict.json
          if-no-files-found: warn
          retention-days: 7

  # web is V7-17C's own CI counterpart of the local `pnpm typecheck && pnpm
  # test && pnpm build` cycle every earlier V7 task already ran by hand
  # before merging (docs/design/09-v7-alpha-ui.md V7-17). Independent of
  # `contract`: it never touches Go, so a broken frontend never has to wait
  # on the Go suite, and a broken Go build never blocks this from reporting
  # its own, unrelated result.
  web:
    name: web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # package_json_file: pnpm/action-setup's own version-detection (the
      # `packageManager` field) only looks at the repo ROOT package.json by
      # default — this repo's own package.json lives under web/, so the
      # default silently finds nothing and fails closed with "No pnpm
      # version is specified" (found live on this job's own first real run).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        shell: bash
        run: pnpm run typecheck

      - name: Unit + component tests
        working-directory: web
        shell: bash
        run: pnpm test

      - name: Build
        working-directory: web
        shell: bash
        run: pnpm run build

  # release-build is V8-08 (docs/design/10-v8-alpha-hardening.md V8-08,
  # "Reproducible cross-platform build"): builds a real `pnpm build` UI
  # output, embeds it into a real `aw`/`aw.exe` binary via
  # cmd/aw-release-build (internal/adapters/embeddedui), builds it a SECOND
  # time from the identical checkout, and proves the two builds are
  # reproducible — byte-identical binaries, and identical release manifests
  # except the one field (generatedAt) this task's own manifest doc comment
  # names as legitimately expected to differ between two runs. Then smoke-
  # tests the actual produced binary on this OS: doctor reports HEALTHY,
  # serve comes up and genuinely serves the embedded UI over real HTTP —
  # V8-08's own "Hoàn thành khi: binary chạy doctor/serve và UI journey tối
  # thiểu trên cả OS" bar. runs-on native per-OS (never cross-compiled),
  # matching every other matrix job in this workflow.
  release-build:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: contract
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # shell: bash on BOTH pnpm steps, deliberately. Under windows-latest's
      # default shell (pwsh) these two steps returned in about a second with no
      # output at all and left a pnpm process running at job cleanup
      # ("Terminate orphan process ... (pnpm)"): the step ended before the UI
      # build did, so web/dist was sometimes not there yet when the next step
      # needed it (run 36755529800 and 36762075634 failed this way; passing runs
      # only won the race). bash waits for the command and honours its exit code.
      - name: Install UI dependencies
        working-directory: web
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build UI
        working-directory: web
        shell: bash
        run: pnpm run build
      # A guard for the same failure mode: if the UI build produced nothing, fail
      # here, at the step that is actually wrong, and list web/.
      - name: Verify the UI build produced web/dist
        shell: bash
        run: |
          if [ ! -f web/dist/index.html ]; then
            echo "web/dist/index.html is missing after 'pnpm run build' - the UI build produced nothing"
            ls -la web || true
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      - name: Build release binary (round 1)
        shell: bash
        run: go run ./cmd/aw-release-build --repo-root . --ui-dist web/dist --out build1/aw

      - name: Restore embeddedui/dist between the two rounds
        shell: bash
        run: git checkout -- internal/adapters/embeddedui/dist

      - name: Build release binary (round 2, for the reproducibility check below)
        shell: bash
        run: go run ./cmd/aw-release-build --repo-root . --ui-dist web/dist --out build2/aw

      - name: Compare the two builds for reproducibility
        shell: bash
        run: |
          set -euo pipefail
          BIN1=$(awk '{print $1}' build1/*.sha256)
          BIN2=$(awk '{print $1}' build2/*.sha256)
          echo "round 1 binary sha256: $BIN1"
          echo "round 2 binary sha256: $BIN2"
          if [ "$BIN1" != "$BIN2" ]; then
            echo "::error::binary checksum mismatch across two identical builds — this build is not reproducible"
            exit 1
          fi
          # generatedAt is the one manifest field this task's own doc
          # comment (cmd/aw/cli.go's releaseManifest) names as legitimately
          # expected to differ between two runs; every other field must
          # match exactly, or an unknown/unexpected difference fails.
          jq 'del(.generatedAt)' build1/aw.manifest.json > build1/aw.manifest.filtered.json
          jq 'del(.generatedAt)' build2/aw.manifest.json > build2/aw.manifest.filtered.json
          if ! diff -u build1/aw.manifest.filtered.json build2/aw.manifest.filtered.json; then
            echo "::error::release manifest differs across two identical builds outside the allowlisted generatedAt field"
            exit 1
          fi
          echo "release manifests match (outside the allowlisted generatedAt field)"

      - name: Restore embeddedui/dist after both rounds
        shell: bash
        run: git checkout -- internal/adapters/embeddedui/dist

      - name: Release smoke — doctor and serve genuinely serve the embedded UI
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(dirname build1/*.sha256)/$(awk '{print $2}' build1/*.sha256)
          mkdir -p smoke/artifacts smoke/workspaces
          "$BIN" doctor --db smoke/aw.db --artifact-root smoke/artifacts --workspace-root smoke/workspaces
          "$BIN" serve --db smoke/aw.db --artifact-root smoke/artifacts --workspace-root smoke/workspaces \
            --host 127.0.0.1 --port 18765 > smoke/serve.log 2>&1 &
          SERVE_PID=$!
          trap 'kill $SERVE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if grep -q '"address"' smoke/serve.log 2>/dev/null; then break; fi
            sleep 0.2
          done
          cat smoke/serve.log
          INDEX=$(curl -sf http://127.0.0.1:18765/)
          echo "$INDEX" | grep -q 'window.__AW_BOOTSTRAP__=' || { echo "::error::/ did not serve the embedded UI's own bootstrap script"; exit 1; }
          # The release manifest the binary reports about itself (V8-12's
          # fresh-install smoke): it must say the UI is embedded and carry a
          # schema version, or this is not the artifact we meant to ship.
          "$BIN" version --json > smoke/version.json
          cat smoke/version.json
          jq -e '.uiEmbedded == true and (.schemaVersion | type == "number")' smoke/version.json > /dev/null \
            || { echo "::error::aw version --json does not report the embedded UI and a schema version"; exit 1; }
          echo "release smoke passed: doctor HEALTHY, serve genuinely served the embedded UI, version --json reports it"

      # Install artifacts (V8-12): the built binary, its .sha256 and the release
      # manifest, kept for every push to master so a verdict can point at real
      # files and not only at a checksum printed in a log. Not uploaded for pull
      # requests (a ~30MB binary per PR run is cost without a reader).
      - name: Upload the install artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aw-release-${{ matrix.os }}
          path: build1/
          if-no-files-found: error
          retention-days: 90

  # e2e is V7-17C's own real full-journey acceptance
  # (docs/design/09-v7-alpha-ui.md V7-17): it drives web/dist through a real
  # browser against real `aw serve --ui-dist web/dist` + `aw worker`
  # processes (see web/e2e/support/stack.ts) on BOTH platforms, mirroring
  # the same "build the real product, run the real product, exercise it
  # through its own real public surface" reasoning `v6-acceptance` above
  # already uses for the Go-side acceptance journey — this is that same
  # journey's UI-driven counterpart. `needs: contract` because
  # web/e2e/support/stack.ts's own globalSetup builds cmd/aw and
  # cmd/fake-claude from this checkout itself; there is no separate reason
  # to spend this job's time on a Go tree `contract` already rejected.
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: contract
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        shell: bash
        run: pnpm install --frozen-lockfile

      # --with-deps installs the real OS package dependencies Chromium needs
      # to launch on a bare Linux runner (fonts, codecs, etc.); on Windows
      # the runner image already has what a bundled Chromium needs, and
      # --with-deps has no Linux-apt-get equivalent to run there.
      - name: Install Playwright Chromium (Linux, with OS deps)
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright Chromium (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: web
        shell: bash
        run: pnpm exec playwright install chromium

      # web/e2e/support/stack.ts requires web/dist to already exist (it
      # never builds the frontend itself) — the same "build once" split
      # `v6-acceptance` above already uses for its own Go binaries.
      - name: Build web/dist
        working-directory: web
        shell: bash
        run: pnpm run build

      - name: Run the full-journey E2E suite
        working-directory: web
        shell: bash
        run: pnpm exec playwright test

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 7

  # v8-alpha-gate is V8-11's Alpha release acceptance assessment
  # (docs/design/10-v8-alpha-hardening.md V8-11): it aggregates every suite
  # above onto the V1-00A..C coverage map and computes one machine-readable
  # `gatePass`. `if: always()` and the whole-suite `needs` list are the point:
  # the assessment must exist even when a suite fails or is skipped
  # (00-roadmap.md §3 - a verdict task may run when its gate fails), with a
  # failing suite reported as FAIL and a skipped/absent one as
  # CHƯA ĐỦ EVIDENCE. internal/alphagate's tests keep this `needs` list, the
  # job ids and the final-gate test run below in step with the gate's tables.
  #
  # --enforce=false: this job always reports gatePass in its summary and
  # artifact but does not itself fail the check on gatePass=false. At the time
  # of V8-11 the parity ledger still pins known debt (internal/delivery/
  # parity/ledger.go) so gatePass is honestly false, and an always-red check
  # would make every unrelated PR unmergeable under this repository's "never
  # merge red" rule. V8-12's verdict is where the gate flips to enforcing.
  v8-alpha-gate:
    name: V8-11 Alpha release acceptance
    runs-on: ubuntu-latest
    needs: [contract, linux-race-and-stability, v8-concurrency-soak-race, v8-concurrency-soak-windows, spike-acceptance, semantic-diff, v6-acceptance, v6-acceptance-diff, v6-gate, v8-04e-gate, v8-fault-matrix, web, release-build, e2e]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: true

      # For a pull request the checked-out commit is the merge of the PR into
      # its base, so HEAD^1 is the base tip and this checks exactly the change;
      # for a push it checks the pushed commit against its parent.
      - name: git diff --check
        id: diffcheck
        continue-on-error: true
        shell: bash
        run: git diff --check HEAD^1 HEAD

      # Test failures here are data for the assessment, never a reason to stop
      # before it is written; AW_ALPHA_GATE=1 switches on the one opt-in check
      # (the parity ledger must be empty) that is skipped in every other run.
      - name: Final-gate tests
        shell: bash
        run: |
          set +e
          AW_ALPHA_GATE=1 go test -count=1 -json \
            ./internal/app/runtime ./internal/delivery/httpapi/apicontract ./internal/delivery/parity \
            -run '^(TestCancelRun_ClaimVsCancel_CommitOrder|TestRouteInventory_ServedEqualsDeclaredBothDirections|TestRecoveryCommandsHaveCoreAPIUICLIOwners|TestRealInventoryParityGate|TestParityLedgerIsEmpty)$' \
            > final-gates.jsonl
          exit 0

      - name: Record the needs context
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS_JSON" > needs.json

      - name: Assess
        shell: bash
        run: |
          set -uo pipefail
          go run ./cmd/v8-alpha-gate --repo-root . --commit "${{ github.sha }}" \
            --needs-json needs.json --final-gate-tests final-gates.jsonl \
            --git-diff-check "${{ steps.diffcheck.outcome }}" \
            --out alpha-assessment.json --markdown-out alpha-assessment.md \
            --enforce=false
          status=$?
          if [ -f alpha-assessment.md ]; then cat alpha-assessment.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit ${status}

      - name: Upload the assessment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v8-alpha-assessment
          path: |
            alpha-assessment.json
            alpha-assessment.md
            final-gates.jsonl
            needs.json
          if-no-files-found: warn
          retention-days: 14
