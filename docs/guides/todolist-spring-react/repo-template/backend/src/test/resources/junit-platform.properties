# Mỗi lớp test dùng một file SQLite riêng trong thư mục tạm của JUnit (@TempDir). Spring giữ context — và kết nối tới
# file đó — tới khi JVM thoát, mà Windows không cho xóa file đang mở. Vì vậy JUnit không dọn thư mục tạm; hệ điều hành
# tự dọn thư mục tạm của nó.
junit.jupiter.tempdir.cleanup.mode.default=never
